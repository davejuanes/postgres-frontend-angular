server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME fixes
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/pdf pdf;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDFs u otros archivos estáticos
    location ~* \.(pdf|wasm|js|mjs|css|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        # opcional: cache
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Seguridad: negar acceso a .ht*
    location ~ /\.ht {
        deny all;
    }
}
