<!-- 1. Instalacion de Leaflet en Angular -->
<!-- 2. Mostrar un mapa con leaflet con OpenStreetMap -->
<!-- 3. -->
<div class="relative h-screen w-full overflow-hidden bg-amber-200">
  <div id="mapa_v2" class="absolute inset-0 z-0"></div>

  <div class="absolute right-4 bottom-7 z-40 flex flex-col gap-3">
    <p-button icon="pi pi-plus" severity="info" [rounded]="true" (click)="acercar()" />

    <p-button icon="pi pi-minus" severity="info" [rounded]="true" (click)="alejar()" />

    <p-button icon="pi pi-compass" severity="info" [rounded]="true" (click)="miUbicacion()" />
  </div>

  <app-footer [latitud_fot]="coordenadas().latitud" [longitud_fot]="coordenadas().longitud">
  </app-footer>
</div>
